name: Test and Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & SQLAlchemy
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic sqlalchemy psycopg[binary] python-jose[cryptography] passlib[bcrypt] python-dotenv pytest httpx

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/
