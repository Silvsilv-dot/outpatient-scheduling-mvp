name: Batch 1 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8 black

    - name: Run Syntax & Import Checks
      run: |
        python -m py_compile rules/business_rules.py
        python -m py_compile db/seed_synthetic.py
        flake8 rules/ db/ --ignore=E501,F401,E402

    - name: Run Business Rules Engine Tests
      run: |
        pytest -v --exitzero
