name: Batch 1 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8

    - name: Run Python Syntax Verification
      run: |
        python -m py_compile rules/business_rules.py
        python -m py_compile db/seed_synthetic.py

    - name: Run Business Rules Import Check
      run: |
        python -c "import rules.business_rules as br; print('Business Rules Engine Loaded Successfully!')"
